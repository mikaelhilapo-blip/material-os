services:
  db:
    image: postgres:16-alpine
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: materialos
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    image: node:22
    restart: on-failure
    working_dir: /app/backend
    volumes:
      - ./:/app
      - /app/backend/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/materialos
      PORT: "4000"
      BASE44_PREVIEW_MODE: ${BASE44_PREVIEW_MODE:-0}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-ec", "npm install && npx prisma generate && npx prisma db push && node src/seed.js && exec npx nodemon src/index.js"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:4000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    image: node:22
    restart: on-failure
    working_dir: /app/frontend
    volumes:
      - ./:/app
      - /app/frontend/node_modules
    ports:
      - "3000:5173"
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-0}
    depends_on:
      backend:
        condition: service_healthy
    command: ["sh", "-ec", "npm install && exec npx vite --host 0.0.0.0 --port 5173"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:5173/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pgdata:
